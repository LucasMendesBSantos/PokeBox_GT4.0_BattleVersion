# Sobe o jogo inteiro: docker compose up --build
# Banco em localhost:5432, back em localhost:8080, front em localhost:5174
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pokebox
      POSTGRES_PASSWORD: pokebox
      POSTGRES_DB: pokebox
    ports:
      - "5432:5432"
    volumes:
      # Roda o db.sql só na primeira vez (quando o volume está vazio)
      - ./db/db.sql:/docker-entrypoint-initdb.d/01-db.sql:ro
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokebox -d pokebox"]
      interval: 2s
      timeout: 3s
      retries: 20

  back:
    build: ./back
    environment:
      DATABASE_URL: postgres://pokebox:pokebox@db:5432/pokebox
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  front:
    build: ./front
    environment:
      # O proxy do Vite (dentro do container) repassa /api para o back pela rede do Docker
      BACK_URL: http://back:8080
    ports:
      - "5174:5174"
    depends_on:
      - back

  # Túnel https até o back, para o front na Vercel conversar com esta máquina.
  # Só sobe com: docker compose --profile online up -d
  # A URL (https://xxxx.trycloudflare.com) aparece em: docker compose logs tunel
  # Ela muda a cada reinício do túnel; aí é preciso atualizar VITE_BACK_URL na Vercel e fazer Redeploy
  tunel:
    image: cloudflare/cloudflared:2025.4.0
    profiles: [online]
    command: tunnel --no-autoupdate --url http://back:8080
    depends_on:
      - back

volumes:
  dados:
